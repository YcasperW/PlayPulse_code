<svg viewBox="0 0 680 350" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<title>PlayPulse 房间分工：流水线与参考书</title>
<desc>挂号与医典在流水线旁边只提供标准，分诊与化验在流水线上真正处理数据，答疑台复用诊室结果。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="350" fill="#FFFFFF"/>

<text x="40" y="44" font-size="12" font-weight="400" fill="#5F5E5A">旁边：只给标准，不碰数据</text>

<g>
<rect x="60" y="56" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="160" y="72" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1 挂号 · schema.py</text>
<text x="160" y="90" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">这一列叫什么</text>
</g>

<g>
<rect x="420" y="56" width="200" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="520" y="72" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">3 医典 · metrics.yaml</text>
<text x="520" y="90" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">这指标怎么算、多少算高</text>
</g>

<text x="40" y="140" font-size="12" font-weight="400" fill="#5F5E5A">流水线：真的在读、在改数据</text>

<g>
<rect x="40" y="152" width="76" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="78" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">原始表</text>
<text x="78" y="188" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">CSV / Excel</text>
</g>

<g>
<rect x="142" y="152" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="198" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">2 分诊</text>
<text x="198" y="188" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">翻行，不算指标</text>
</g>

<g>
<rect x="280" y="152" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="336" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">4 化验</text>
<text x="336" y="188" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">造新列，带区间</text>
</g>

<g>
<rect x="418" y="152" width="112" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="474" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">6 诊室</text>
<text x="474" y="188" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">照规则下诊断</text>
</g>

<g>
<rect x="556" y="152" width="84" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="598" y="170" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">7 病历</text>
<text x="598" y="188" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">写报告</text>
</g>

<path d="M118 178 L138 178" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M256 178 L276 178" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M394 178 L414 178" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M532 178 L552 178" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M160 104 L160 150" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="168" y="130" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">查列名</text>

<path d="M520 104 L520 128 L336 128 L336 150" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="400" y="120" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">查公式</text>

<g>
<rect x="418" y="250" width="150" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="493" y="268" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">8 答疑 · cards.py</text>
<text x="493" y="286" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">换个角度讲，不重算</text>
</g>

<path d="M474 204 L474 248" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="482" y="226" font-size="12" font-weight="400" fill="#5F5E5A" dominant-baseline="central">吃 pc，不重新化验</text>

<text x="40" y="326" font-size="12" font-weight="400" fill="#5F5E5A">实线 = 数据在流动　·　虚线 = 只是被查阅，或复用已有的结果</text>
</svg>
